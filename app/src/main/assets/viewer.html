<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CET Sample Pack</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1a1d21;--mut:#68707a;--line:#e1e4e8;--acc:#1f3a5f;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#191c22;--fg:#e6e8eb;--mut:#9aa1a9;--line:#2b3038;--acc:#8fb4ff;--ok:#4ade80;--okbg:#12301f;--bad:#f87171;--badbg:#3a1616;--chip:#242932}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
header h1{margin:0;font-size:18px;display:flex;justify-content:space-between;gap:8px}
header h1 small{font-weight:400;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:12px 16px 90px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px}
.sb{background:var(--badbg);color:var(--bad)}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:14px;color:var(--fg)}
.passage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;white-space:pre-wrap;font-size:15px}
.passage summary{cursor:pointer;color:var(--mut);font-size:13px}
.q{white-space:pre-wrap;margin:12px 0;font-weight:500}
.figs{display:flex;gap:6px;margin:8px 0}
.figs .f{flex:1 1 0;min-width:0;max-width:90px;text-align:center;font-size:12px;color:var(--mut)}
.figs.one .f{max-width:220px}
svg{width:100%;height:auto;display:block;color:var(--fg)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt b{min-width:20px;color:var(--mut)}
.opt .svgo{width:80px}
.opt .svgo.wide{width:150px}
.opts.grid{display:grid;grid-template-columns:repeat(3,1fr)}
.opts.grid .opt{flex-direction:column;gap:4px;padding:8px}
.opts.grid .opt .svgo{width:100%;max-width:90px}
.opts.grid.wide{grid-template-columns:repeat(2,1fr)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.sol{margin-top:12px;background:var(--card);border-left:4px solid var(--acc);border-radius:6px;padding:10px 12px;font-size:15px}
.sol .res{font-weight:600;margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 16px;justify-content:center}
nav button{flex:1;max-width:220px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
nav button.p{background:var(--acc);color:var(--card);border:0}
.flag{border:1px solid var(--line);background:none;color:var(--mut);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;margin-top:10px}
.flag.on{color:var(--bad);border-color:var(--bad)}
.sum table{width:100%;border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden}
.sum td,.sum th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
</style>
</head>
<body>
<header>
  <h1>CET Sample Pack <small id="score"></small></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"></main>
<nav><button id="prev">← Prev</button><button class="p" id="next">Next →</button></nav>
<script>
const PACK = /*PACK*/[];
const SEC = {LR:'Logical Reasoning', AR:'Abstract Reasoning', QA:'Quant', VA:'Verbal & RC'};
const PACK_ID = /*PACKID*/'sample';
const KEY = 'cet-' + PACK_ID;  // per pack, so a new pack starts with fresh answers
let st = {}; try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch {}
st.ans ||= {}; st.time ||= {}; st.flag ||= {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
let filter = 'ALL', idx = 0, t0 = Date.now(), tick;
const list = () => filter === 'ALL' ? PACK : filter === 'SUM' ? [] : PACK.filter(q => q.section === filter);
const isSvg = s => s.trim().startsWith('<svg');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function tabs() {
  const t = [['ALL',`All ${PACK.length}`], ...Object.entries(SEC).map(([k,v]) => [k, `${k} · ${PACK.filter(q=>q.section===k).length}`]), ['SUM','Results']];
  document.getElementById('tabs').innerHTML = t.map(([k,l]) => `<button class="${filter===k?'on':''}" data-k="${k}">${l}</button>`).join('');
  const done = Object.keys(st.ans).length, ok = PACK.filter(q => st.ans[q.id] === q.answer).length;
  document.getElementById('score').textContent = `${done}/${PACK.length} done · ${ok} right`;
}
document.getElementById('tabs').onclick = e => { const k = e.target.dataset.k; if (!k) return; filter = k; idx = 0; render(); };

function render() {
  clearInterval(tick); tabs();
  const m = document.getElementById('main');
  if (filter === 'SUM') return summary(m);
  const L = list(), q = L[idx];
  const answered = q.id in st.ans;
  const dots = '●'.repeat(q.difficulty) + '○'.repeat(5 - q.difficulty);
  const origin = {generated:'answer computed by code', 'code-checked':'numbers code-checked', 'hand-written':'hand-written, re-solved blind'}[q.origin];
  m.innerHTML = `
    <div class="chips"><span class="chip">${q.id} · ${SEC[q.section]}</span><span class="chip">${esc(q.topic)}</span>
      <span class="chip" title="difficulty">${dots}</span>${q.speedbreaker ? '<span class="chip sb">speed-breaker</span>' : ''}
      <span class="timer" id="timer"></span></div>
    <div class="chips" style="margin-top:4px">✓ ${origin}</div>
    ${q.passage ? `<details class="passage" ${idx && L[idx-1].passage === q.passage ? '' : 'open'}><summary>Passage / set</summary>${esc(q.passage)}</details>` : ''}
    ${q.figs && q.figs.length ? `<div class="figs ${q.figs.length === 1 ? 'one' : ''}">${q.figs.map((f,i) => `<div class="f">${f}${q.figs.length>1 ? i+1 : ''}</div>`).join('')}</div>` : ''}
    <div class="q">${esc(q.q)}</div>
    <div class="opts ${isSvg(q.options[0]) ? 'grid' : ''} ${q.options[0].includes('0 0 100 52') ? 'wide' : ''}">${q.options.map((o,i) => `<button class="opt" data-i="${i}" ${answered?'disabled':''}><b>${'ABCDE'[i]}</b>${isSvg(o) ? `<span class="svgo ${o.includes('0 0 100 52')?'wide':''}">${o}</span>` : esc(o)}</button>`).join('')}</div>
    <div id="sol"></div>
    <button class="flag ${st.flag[q.id]?'on':''}" id="flag">👎 ${st.flag[q.id] ? 'Flagged as bad' : 'Bad question?'}</button>
    <p class="chips" style="margin-top:14px">${idx+1} of ${L.length}</p>`;
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').textContent = idx === L.length - 1 ? 'Results →' : 'Next →';
  if (answered) showSol(q); else { t0 = Date.now(); tick = setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = Math.floor((Date.now()-t0)/1000) + 's'; }, 250); }
  m.querySelector('.opts').onclick = e => {
    const b = e.target.closest('.opt'); if (!b || b.disabled) return;
    st.ans[q.id] = +b.dataset.i; st.time[q.id] = Math.round((Date.now()-t0)/1000); save(); render(); document.getElementById('sol').scrollIntoView({block: 'start'});
  };
  document.getElementById('flag').onclick = () => { st.flag[q.id] = !st.flag[q.id]; save(); render(); };
  window.scrollTo(0, 0);
}

function showSol(q) {
  const a = st.ans[q.id], ok = a === q.answer, t = st.time[q.id];
  document.querySelectorAll('.opt').forEach((b,i) => { if (i === q.answer) b.classList.add('right'); else if (i === a) b.classList.add('wrong'); });
  document.getElementById('timer').textContent = t + 's';
  const pace = t <= 45 ? 'within the 45 s exam pace' : `${t - 45} s over the 45 s exam pace`;
  document.getElementById('sol').innerHTML = `<div class="sol"><div class="res" style="color:var(--${ok?'ok':'bad'})">${ok ? '✓ Correct' : '✗ Answer: ' + 'ABCDE'[q.answer]} · ${t} s (${pace})</div>${esc(q.solution)}</div>`;
}

function summary(m) {
  const rows = Object.entries(SEC).map(([k,v]) => {
    const qs = PACK.filter(q => q.section === k), done = qs.filter(q => q.id in st.ans);
    const ok = done.filter(q => st.ans[q.id] === q.answer).length;
    const avg = done.length ? Math.round(done.reduce((s,q) => s + st.time[q.id], 0) / done.length) : '–';
    return `<tr><td>${v}</td><td>${ok}/${done.length} of ${qs.length}</td><td>${avg} s</td></tr>`;
  }).join('');
  const flagged = PACK.filter(q => st.flag[q.id]).map(q => q.id).join(', ') || 'none';
  m.innerHTML = `<div class="sum"><table><tr><th>Section</th><th>Right</th><th>Avg time</th></tr>${rows}</table>
    <p class="chips" style="margin-top:12px">Flagged as bad: ${flagged}</p>
    <p class="chips">Real exam pace: 200 questions in 150 min ≈ 45 s each. Tell us which questions felt too easy, too hard, or wrong.</p>
    <button class="flag" id="reset">Reset all answers</button></div>`;
  document.getElementById('reset').onclick = () => { if (confirm('Clear all answers?')) { st = {ans:{},time:{},flag:{}}; save(); render(); } };
}

document.getElementById('prev').onclick = () => { if (idx > 0) { idx--; render(); } };
document.getElementById('next').onclick = () => { if (idx < list().length - 1) { idx++; render(); } else { filter = 'SUM'; render(); } };
render();
</script>
</body>
</html>
